name: HOKSH quality check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, JavaScript and PWA manifest
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in html
          assert '<title>' in html and '</html>' in html
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No inline application script found'
          Path('/tmp/hoksh-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('start_url') == './'
          assert manifest.get('display') == 'standalone'
          assert "navigator.serviceWorker.register('./sw.js')" in html
          print('HTML and PWA manifest checks passed')
          PY
          node --check /tmp/hoksh-inline.js
          node --check sw.js
          node --check noor-content.js
