<!-- floating PDF card -->
<g transform="translate(90 280) rotate(-8 115 150)" filter="url(#shadow)">
 <rect width="210" height="285" rx="24" fill="#fff" stroke="#e5e9f7" stroke-width="3"/>
 <rect x="23" y="24" width="54" height="66" rx="13" fill="#fff0f1"/><path d="M40 40h20v28H40z" fill="none" stroke="#e45768" stroke-width="3"/><path d="M45 48h10m-10 7h10m-10 7h7" stroke="#e45768" stroke-width="2.5" stroke-linecap="round"/>
 <rect x="91" y="35" width="89" height="9" rx="4.5" fill="#24304e"/><rect x="91" y="53" width="68" height="6" rx="3" fill="#c2c9d9"/>
 <rect x="24" y="113" width="162" height="7" rx="3.5" fill="#dce1ed"/><rect x="24" y="132" width="146" height="7" rx="3.5" fill="#dce1ed"/><rect x="24" y="151" width="157" height="7" rx="3.5" fill="#dce1ed"/>
 <rect x="24" y="181" width="162" height="65" rx="12" fill="#eff1ff"/><path d="M39 226l30-24 25 13 27-21 42 30" fill="none" stroke="#6558f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- note card -->
<g transform="translate(870 250) rotate(7 110 85)" filter="url(#shadow)">
 <rect width="220" height="164" rx="22" fill="#f7fffb" stroke="#d7ffed" stroke-width="2"/>
 <rect x="20" y="20" width="180" height="36" rx="11" fill="#dffbed"/>
