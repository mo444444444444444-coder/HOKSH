<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">HOKSH — مساحة دراسة وكتابة</title>
<desc id="desc">رسم توضيحي لشخص يرتدي هودي أسود ويدرس على جهاز لوحي مع قلم رقمي ونوافذ PDF عائمة.</desc>
