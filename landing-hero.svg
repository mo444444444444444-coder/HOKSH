 <path d="M484 364q18-12 35 0M555 364q18-12 35 0" fill="none" stroke="#55372f" stroke-width="6" stroke-linecap="round"/>
 <ellipse cx="502" cy="378" rx="5" ry="7" fill="#24263a"/><ellipse cx="573" cy="378" rx="5" ry="7" fill="#24263a"/>
 <path d="M529 381l-8 31 15 3" fill="none" stroke="#9b5c48" stroke-width="4" stroke-linecap="round"/>
 <path d="M505 431q30 19 58-1" fill="none" stroke="#7e403c" stroke-width="5" stroke-linecap="round"/>
 <!-- hoodie hood -->
 <path d="M430 536c-22-65-4-115 43-143 12 71 36 102 75 104 40 2 68-31 80-103 50 33 67 84 43 146l-48 44H476z" fill="#26324e" stroke="#3d4a6d" stroke-width="5"/>
 <path d="M469 536c25 35 52 52 80 52 30 0 57-18 79-52" fill="none" stroke="#111a30" stroke-width="8" stroke-linecap="round"/>
 <!-- left arm -->
 <path d="M397 583c-39 19-70 66-91 125l-38 82c-9 20 1 39 20 43 15 3 27-8 35-25l65-101 53-63z" fill="#202b48"/>
 <path d="M291 770c-11 23-21 37-13 49 8 11 24 8 36-8l28-39-31-25z" fill="url(#skin)"/>
 <!-- right arm -->
 <path d="M644 583c39 20 72 62 92 115l38 76c8 18 0 36-17 41-16 4-29-8-37-25l-60-95-61-59z" fill="#202b48"/>
 <path d="M755 762c13 18 24 36 16 48-9 12-24 7-36-7l-27-37 29-25z" fill="url(#skin)"/>
</g>
<!-- tablet -->
<g transform="translate(350 565) rotate(-8 205 125)" filter="url(#shadow)">
 <rect width="420" height="270" rx="28" fill="#0b1022" stroke="#69779c" stroke-width="5"/>
 <rect x="16" y="16" width="388" height="238" rx="17" fill="url(#tablet)"/>
 <rect x="36" y="36" width="348" height="198" rx="12" fill="#f8f9ff"/>
 <rect x="52" y="52" width="112" height="164" rx="8" fill="#e9edff"/>
 <rect x="66" y="67" width="83" height="7" rx="3.5" fill="#aab3d1"/><rect x="66" y="83" width="67" height="7" rx="3.5" fill="#aab3d1"/>
 <path d="M64 175l24-32 21 17 18-30 21 21" fill="none" stroke="#6558f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="183" y="57" width="180" height="10" rx="5" fill="#263452"/><rect x="183" y="78" width="160" height="6" rx="3" fill="#d0d5e4"/><rect x="183" y="94" width="174" height="6" rx="3" fill="#d0d5e4"/>
 <path d="M186 143q24-25 44 0t42 0 42 0 37 0" fill="none" stroke="#27a77d" stroke-width="5" stroke-linecap="round"/>
 <path d="M184 165h174M184 182h139M184 199h160" stroke="#d5d9e6" stroke-width="6" stroke-linecap="round"/>
 <circle cx="210" cy="245" r="3" fill="#7e89aa"/>
</g>
<!-- stylus -->
<g transform="translate(720 520) rotate(30)" filter="url(#shadow)">
 <rect x="0" y="0" width="17" height="205" rx="8.5" fill="url(#mint)"/><rect x="4" y="24" width="9" height="112" rx="4.5" fill="#effff8"/><path d="M0 195l8.5 22 8.5-22z" fill="#b7ffe1"/>
</g>
<!-- small floating badge -->
<g transform="translate(770 680)" filter="url(#shadow)">
 <rect width="180" height="66" rx="20" fill="#ffffff" fill-opacity=".96"/>
 <rect x="14" y="14" width="38" height="38" rx="12" fill="#d9fbea"/><path d="M24 33l7 7 13-17" fill="none" stroke="#168b64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="64" y="22" width="94" height="7" rx="3.5" fill="#263452"/><rect x="64" y="37" width="70" height="6" rx="3" fill="#a8b1c7"/>
</g>
</svg>