 <rect x="70" y="34" width="105" height="7" rx="3.5" fill="#207a60"/>
 <rect x="22" y="76" width="170" height="7" rx="3.5" fill="#d3dfda"/><rect x="22" y="94" width="145" height="7" rx="3.5" fill="#d3dfda"/><rect x="22" y="112" width="160" height="7" rx="3.5" fill="#d3dfda"/>
</g>
