name: Validate HOKSH Business Codebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate current app structure and PWA assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          required = ['id="authScreen"', 'id="app"', 'id="dashboard"', 'id="pos"', 'id="products"', 'id="purchases"', 'id="customers"', 'id="reports"', 'id="settings"']
          missing = [item for item in required if item not in html]
          assets = ['manifest.webmanifest', 'icon.svg', 'sw.js']
          missing_assets = [item for item in assets if not (root / item).exists()]
          if missing or missing_assets:
              raise SystemExit('Missing app sections: ' + repr(missing) + '; assets: ' + repr(missing_assets))
          manifest = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('display') == 'standalone'
          assert "navigator.serviceWorker.register('./sw.js')" in html
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline application JavaScript found')
          Path('/tmp/hoksh-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Current HOKSH Business sections and PWA assets passed.')
          PY
      - name: Syntax-check application JavaScript
        run: |
          node --check /tmp/hoksh-inline.js
          node --check sw.js
          echo "Application and service worker syntax checks passed."
