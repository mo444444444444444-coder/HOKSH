<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حوكش — محرر الصور والـPDF</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0b1020;color:#eef2ff;height:100vh;overflow:hidden}
:root{--panel:#121a2e;--panel2:#18233d;--line:#2b3857;--accent:#6d7cff;--text:#eef2ff;--muted:#9aa8c7}
.app{height:100vh;display:flex;flex-direction:column}.top{height:64px;background:#10182b;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-shrink:0}
.brand{font-size:24px;font-weight:900;letter-spacing:-1px;margin-left:8px}.brand span{color:#7d8bff}.sub{color:var(--muted);font-size:12px}
button,.tool,.select,input{font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.btn:hover,.tool:hover{border-color:#6f7eff;background:#202c4b}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.spacer{flex:1}
.body{min-height:0;flex:1;display:flex}.sidebar{width:82px;background:#0e1628;border-left:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:7px}.tool{height:56px;border:1px solid transparent;border-radius:11px;background:transparent;color:#c9d3ed;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.tool b{font-size:20px}.tool.active{background:#253154;border-color:#5364a9;color:#fff}.workspace{position:relative;min-width:0;flex:1;background:#070b15;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:relative;box-shadow:0 18px 50px #0008;background:white}.stage canvas{display:block}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.emptyBox{border:1px dashed #52607f;border-radius:18px;padding:35px 55px;text-align:center;color:#9aa8c7}.emptyBox strong{display:block;font-size:22px;color:#eaf0ff;margin-bottom:8px}
.right{width:270px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}.section{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.section h3{font-size:13px;margin:0 0 10px;color:#cdd7ef}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{font-size:12px;color:var(--muted);min-width:55px}.color{width:38px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:#fff}.range{width:100%}.mini{font-size:12px;color:var(--muted)}.pagebar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#121a2eee;border:1px solid var(--line);border-radius:14px;padding:7px;display:flex;gap:7px;align-items:center;z-index:5}.pagebar button{padding:6px 10px}.status{position:absolute;bottom:15px;right:15px;background:#121a2eee;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12px;color:#c7d1e9;z-index:5}
#file{display:none}.drop{border:1px dashed #506080;border-radius:12px;padding:15px;text-align:center;color:var(--muted);cursor:pointer}.drop:hover{border-color:#7788ff;color:#fff}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.dialog{width:min(440px,92vw);background:#121a2e;border:1px solid var(--line);border-radius:16px;padding:18px}.dialog textarea{width:100%;height:110px;background:#0b1020;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#26365b;border:1px solid #5367a9;padding:10px 15px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}
@media(max-width:900px){.right{width:220px}.sidebar{width:68px}.sub{display:none}}@media(max-width:680px){.right{display:none}.top .btn span{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">حوكش <span>✦</span></div><div class="sub">Smart Image & PDF Studio</div>
<div class="spacer"></div>
<button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button>
<button class="btn" id="zoomOut">−</button><button class="btn" id="zoomReset">100%</button><button class="btn" id="zoomIn">+</button>
<button class="btn primary" id="export">تصدير</button>
<label class="btn primary" for="file">فتح ملف</label><input id="file" type="file" accept="image/*,.pdf,application/pdf">
</header>
<div class="body">
<nav class="sidebar">
<button class="tool active" data-tool="select"><b>↖</b>تحديد</button>
<button class="tool" data-tool="pen"><b>✎</b>قلم</button>
<button class="tool" data-tool="highlight"><b>▰</b>هايلايتر</button>
<button class="tool" data-tool="line"><b>╱</b>خط</button>
<button class="tool" data-tool="arrow"><b>➜</b>سهم</button>
<button class="tool" data-tool="rect"><b>□</b>مربع</button>
<button class="tool" data-tool="circle"><b>○</b>دائرة</button>
<button class="tool" data-tool="text"><b>T</b>نص</button>
<button class="tool" data-tool="eraser"><b>⌫</b>مسح</button>
</nav>
<main class="workspace" id="workspace">
<div class="stage" id="stage"><canvas id="canvas"></canvas></div>
<div class="empty" id="empty"><div class="emptyBox"><strong>ابدأ في حوكش</strong><span>ارفع صورة أو ملف PDF ثم اكتب وارسم واحفظ عملك</span></div></div>
<div class="pagebar" id="pagebar" style="display:none"><button id="prev">‹</button><span id="pageInfo">1 / 1</span><button id="next">›</button></div>
<div class="status" id="status">جاهز</div>
</main>
<aside class="right">
<div class="section"><h3>الملف</h3><label class="drop" for="file">اسحب صورة أو PDF هنا<br><small>JPG · PNG · WEBP · PDF</small></label></div>
<div class="section"><h3>أداة الرسم</h3>
<div class="row"><label>اللون</label><input class="color" id="color" type="color" value="#ff3158"></div>
<div class="row"><label>السُمك</label><input class="range" id="size" type="range" min="1" max="40" value="5"><span id="sizeVal">5</span></div>
<div class="row"><label>شفافية</label><input class="range" id="opacity" type="range" min="10" max="100" value="100"><span id="opVal">100%</span></div>
</div>
<div class="section"><h3>النص</h3><div class="row"><label>الحجم</label><input class="range" id="fontSize" type="range" min="12" max="96" value="32"><span id="fontVal">32</span></div><div class="mini">اختر أداة «نص» ثم اضغط على اللوحة.</div></div>
<div class="section"><h3>اختصارات</h3><div class="mini">Ctrl/Cmd + Z تراجع<br>Ctrl/Cmd + Y إعادة<br>+ / − تكبير<br>Esc إلغاء</div></div>
</aside>
</div>
</div>
<div class="modal" id="textModal"><div class="dialog"><h3>إضافة نص</h3><textarea id="textInput" placeholder="اكتب النص هنا..."></textarea><div class="row" style="justify-content:flex-end"><button class="btn" id="cancelText">إلغاء</button><button class="btn primary" id="addText">إضافة</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),workspace=document.getElementById('workspace');
let bg=null, tool='select', drawing=false, start={x:0,y:0}, current=null, strokes=[], undone=[], scale=1, pdf=null,page=1,pdfMode=false,pendingText=null;
const color=document.getElementById('color'),size=document.getElementById('size'),opacity=document.getElementById('opacity');
const state={w:1200,h:800};
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function resizeCanvas(w,h){state.w=w;state.h=h;canvas.width=w;canvas.height=h;stage.style.width=w+'px';stage.style.height=h+'px';render()}
function fit(){const r=workspace.getBoundingClientRect(),pad=55;scale=Math.min((r.width-pad)/state.w,(r.height-pad)/state.h,1.5);stage.style.transform='scale('+scale+')';document.getElementById('zoomReset').textContent=Math.round(scale*100)+'%'}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function render(){ctx.clearRect(0,0,state.w,state.h);if(bg)ctx.drawImage(bg,0,0,state.w,state.h);for(const s of strokes)drawShape(s);if(current)drawShape(current);fit()}
function drawShape(s){ctx.save();ctx.globalAlpha=(s.opacity??1);ctx.lineWidth=s.width||4;ctx.strokeStyle=s.color||'#ff3158';ctx.fillStyle=s.fill||'transparent';ctx.lineCap='round';ctx.lineJoin='round';
if(s.type==='pen'||s.type==='highlight'){ctx.globalAlpha=s.type==='highlight'?0.28:(s.opacity??1);ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
else if(s.type==='line'||s.type==='arrow'){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x2,s.y2);ctx.stroke();if(s.type==='arrow'){const a=Math.atan2(s.y2-s.y,s.x2-s.x),L=16;ctx.beginPath();ctx.moveTo(s.x2,s.y2);ctx.lineTo(s.x2-L*Math.cos(a-.5),s.y2-L*Math.sin(a-.5));ctx.moveTo(s.x2,s.y2);ctx.lineTo(s.x2-L*Math.cos(a+.5),s.y2-L*Math.sin(a+.5));ctx.stroke()}}
else if(s.type==='rect'){ctx.strokeRect(s.x,s.y,s.x2-s.x,s.y2-s.y)}
else if(s.type==='circle'){const cx=(s.x+s.x2)/2,cy=(s.y+s.y2)/2,rx=Math.abs(s.x2-s.x)/2,ry=Math.abs(s.y2-s.y)/2;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke()}
else if(s.type==='text'){ctx.fillStyle=s.color;ctx.font=s.size+'px system-ui';ctx.textBaseline='top';ctx.fillText(s.text,s.x,s.y)}
ctx.restore()}
function snapshot(){undone=[]}
function add(s){strokes.push(s);snapshot();render()}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.cursor=t==='select'?'default':'crosshair'}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
canvas.addEventListener('pointerdown',e=>{if(!bg)return;if(tool==='text'){pendingText=pos(e);document.getElementById('textModal').classList.add('show');document.getElementById('textInput').focus();return}if(tool==='eraser'){drawing=true;start=pos(e);return}drawing=true;start=pos(e);const p={x:start.x,y:start.y};if(tool==='pen'||tool==='highlight')current={type:tool,points:[p],color:color.value,width:+size.value,opacity:+opacity.value/100};else if(['line','arrow','rect','circle'].includes(tool))current={type:tool,x:start.x,y:start.y,x2:start.x,y2:start.y,color:color.value,width:+size.value,opacity:+opacity.value/100}});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);if(tool==='eraser'){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,+size.value*2,0,7);ctx.fill();ctx.restore();return}if(current?.points)current.points.push(p);else if(current){current.x2=p.x;current.y2=p.y}render()});
canvas.addEventListener('pointerup',e=>{if(!drawing)return;drawing=false;if(tool==='eraser'){saveRasterState();return}if(current){strokes.push(current);undone=[];current=null;render()}});
function saveRasterState(){const im=ctx.getImageData(0,0,state.w,state.h);strokes.push({type:'raster',im});undone=[]}
function undo(){if(strokes.length){undone.push(strokes.pop());render()}}
function redo(){if(undone.length){strokes.push(undone.pop());render()}}
document.getElementById('undo').onclick=undo;document.getElementById('redo').onclick=redo;
document.getElementById('size').oninput=e=>document.getElementById('sizeVal').textContent=e.target.value;
document.getElementById('opacity').oninput=e=>document.getElementById('opVal').textContent=e.target.value+'%';
document.getElementById('fontSize').oninput=e=>document.getElementById('fontVal').textContent=e.target.value;
document.getElementById('zoomIn').onclick=()=>{scale=Math.min(scale*1.15,4);fitZoom()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(scale/1.15,.2);fitZoom()};document.getElementById('zoomReset').onclick=()=>{scale=1;fitZoom()};
function fitZoom(){stage.style.transform='scale('+scale+')';document.getElementById('zoomReset').textContent=Math.round(scale*100)+'%'}
document.getElementById('cancelText').onclick=()=>document.getElementById('textModal').classList.remove('show');
document.getElementById('addText').onclick=()=>{const text=document.getElementById('textInput').value.trim();if(text&&pendingText)add({type:'text',text,x:pendingText.x,y:pendingText.y,color:color.value,size:+document.getElementById('fontSize').value,opacity:+opacity.value/100});document.getElementById('textInput').value='';document.getElementById('textModal').classList.remove('show')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='Escape')document.getElementById('textModal').classList.remove('show')});
document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);
workspace.addEventListener('dragover',e=>e.preventDefault());workspace.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
async function loadFile(file){if(!file)return;document.getElementById('empty').style.display='none';strokes=[];undone=[];pdfMode=false;
if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){try{const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const data=await file.arrayBuffer();pdf=await lib.getDocument({data}).promise;pdfMode=true;page=1;document.getElementById('pagebar').style.display='flex';await renderPdfPage();toast('تم فتح ملف PDF')}catch(err){console.error(err);toast('تعذر فتح ملف PDF')}}else{const img=new Image();img.onload=()=>{bg=img;resizeCanvas(img.naturalWidth,img.naturalHeight);toast('تم فتح الصورة')};img.src=URL.createObjectURL(file);document.getElementById('pagebar').style.display='none'}}
async function renderPdfPage(){const pg=await pdf.getPage(page),vp=pg.getViewport({scale:1.5});const c=document.createElement('canvas'),cctx=c.getContext('2d');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:cctx,viewport:vp}).promise;bg=c;resizeCanvas(c.width,c.height);document.getElementById('pageInfo').textContent=page+' / '+pdf.numPages}
document.getElementById('prev').onclick=async()=>{if(pdf&&page>1){page--;strokes=[];await renderPdfPage()}};document.getElementById('next').onclick=async()=>{if(pdf&&page<pdf.numPages){page++;strokes=[];await renderPdfPage()}};
document.getElementById('export').onclick=()=>{if(!bg){toast('افتح صورة أو PDF أولاً');return}const out=document.createElement('canvas');out.width=state.w;out.height=state.h;const oc=out.getContext('2d');if(bg)oc.drawImage(bg,0,0,state.w,state.h);for(const s of strokes){if(s.type==='raster')continue;drawShapeOn(oc,s)}out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hoksh-'+Date.now()+'.png';a.click();toast('تم تصدير الصورة')},'image/png')}
function drawShapeOn(c,s){c.save();c.globalAlpha=s.opacity??1;c.lineWidth=s.width||4;c.strokeStyle=s.color||'#ff3158';c.lineCap='round';c.lineJoin='round';if(s.type==='pen'||s.type==='highlight'){c.globalAlpha=s.type==='highlight'?0.28:s.opacity??1;c.beginPath();s.points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}else if(s.type==='line'||s.type==='arrow'){c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.x2,s.y2);c.stroke();if(s.type==='arrow'){const a=Math.atan2(s.y2-s.y,s.x2-s.x),L=16;c.beginPath();c.moveTo(s.x2,s.y2);c.lineTo(s.x2-L*Math.cos(a-.5),s.y2-L*Math.sin(a-.5));c.moveTo(s.x2,s.y2);c.lineTo(s.x2-L*Math.cos(a+.5),s.y2-L*Math.sin(a+.5));c.stroke()}}else if(s.type==='rect')c.strokeRect(s.x,s.y,s.x2-s.x,s.y2-s.y);else if(s.type==='circle'){const cx=(s.x+s.x2)/2,cy=(s.y+s.y2)/2,rx=Math.abs(s.x2-s.x)/2,ry=Math.abs(s.y2-s.y)/2;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);c.stroke()}else if(s.type==='text'){c.fillStyle=s.color;c.font=s.size+'px system-ui';c.textBaseline='top';c.fillText(s.text,s.x,s.y)}c.restore()}
window.addEventListener('resize',fit);resizeCanvas(1200,800);
</script>
</body></html>
