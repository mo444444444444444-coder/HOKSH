<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">HOKSH — مساحة مذاكرة رقمية</title>
<desc id="desc">رسم جديد عالي الوضوح لشخص يذاكر باستخدام جهاز لوحي وقلم رقمي، مع بطاقات PDF وملاحظات عائمة.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253b78"/><stop offset=".58" stop-color="#172750"/><stop offset="1" stop-color="#111a35"/></linearGradient>
 <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303b5c"/><stop offset="1" stop-color="#11182b"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dca27f"/><stop offset="1" stop-color="#a9674f"/></linearGradient>
 <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303d65"/><stop offset="1" stop-color="#11182d"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0ffe9"/><stop offset="1" stop-color="#7be2b7"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
</defs>
<rect width="1200" height="900" rx="44" fill="url(#bg)"/>
<circle cx="610" cy="410" r="290" fill="#6e85f8" opacity=".12"/>
<circle cx="570" cy="400" r="215" fill="#9bf0ce" opacity=".08"/>
<circle cx="1020" cy="170" r="115" fill="#a8f0cf" opacity=".08" filter="url(#soft)"/>
