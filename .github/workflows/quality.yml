name: HOKSH quality check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML, JavaScript and PWA manifest
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in html
          assert '<title>' in html and '</html>' in html
          assert 'href="./style.css"' in html
          for name in ['app.js', 'quran-module.js', 'hadith-module.js', 'knowledge-data.js', 'noor-content.js', 'noor-expansion.js', 'noor-prophets.js', 'noor-prophet-videos.js', 'noor-seerah-fiqh.js']:
              assert Path(name).is_file(), f'Missing application module: {name}'
              assert f'src="./{name}"' in html, f'Module not loaded: {name}'
          app = Path('app.js').read_text(encoding='utf-8')
          assert "navigator.serviceWorker.register('./sw.js')" in app
          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('start_url') == './'
          assert manifest.get('display') == 'standalone'
          sw = Path('sw.js').read_text(encoding='utf-8')
          for name in ['style.css', 'app.js', 'quran-module.js', 'hadith-module.js', 'knowledge-data.js', 'noor-expansion.js', 'noor-prophets.js']:
              assert name in sw, f'PWA cache missing: {name}'
          print('HTML, modules and PWA manifest checks passed')
          PY
          for file in app.js quran-module.js hadith-module.js knowledge-data.js noor-content.js noor-expansion.js noor-prophets.js noor-seerah-fiqh.js noor-prophet-videos.js sw.js; do
            node --check "$file"
          done
